services:
  todo:
    build: ./backend
    image: ghcr.io/godack1905/todo-family:latest
    container_name: todo-app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:?Define DATABASE_URL in .env or environment}
      - DATABASE_URL_FALLBACK=${DATABASE_URL_FALLBACK:-}
    restart: unless-stopped
